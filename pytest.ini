[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 详细输出 + Allure 原始数据 + JUnit 报告 + UI 用例失败重跑 1 次（网络/渲染抖动）
addopts = -vs --alluredir=report/allure_raw --clean-alluredir -p no:cacheprovider
          --reruns=1 --reruns-delay=2

markers =
    ui: UI 自动化用例
