# 环境切换：local（本地后台站点）/ ci（Jenkins 容器访问宿主机）
current_env: "local"

local:
  base_url: "http://127.0.0.1:9100"
  timeout: 10000        # 元素等待超时，单位毫秒
  headless: true        # 无头模式，CI 必须为 true
  slow_mo: 0            # 每步操作间隔，调试时设为 500 便于观察

ci:
  base_url: "http://host.docker.internal:9100"
  timeout: 15000
  headless: true
  slow_mo: 0

# 后台账号：本地 Mock 站点固定账号，不是真实凭据
# 真实项目账号写在 config/env_local.yaml（已在 .gitignore 中排除）
account:
  username: "testuser"
  password: "123456"
